# AMA Robotics Tmux Configuration
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g status-interval 5

set -g status-style "bg=#0b101b,fg=#d8dee9"
set -g pane-border-style "fg=#0b101b,bg=#0b101b"
set -g pane-active-border-style "fg=#0b101b,bg=#0b101b"

set -g status-left-length 40
set -g status-left " #[fg=#0b101b,bg=#2596ff,bold] 󰈙 #I:zsh #[fg=#2596ff,bg=#0b101b]"

set -g window-status-format ""
set -g window-status-current-format ""

set -g status-right-length 100
set -g status-right "#[fg=#22c55e]● #[fg=#94a3b8]AMA  #[fg=#334155]│  #[fg=#94a3b8]📅 %b %d, %Y  #[fg=#334155]│  #[fg=#94a3b8]🕒 %H:%M "

set -g base-index 1
setw -g pane-base-index 1
bind r source-file ~/.tmux.conf \; display "Config Reloaded"
set -sg escape-time 10
set -g pane-border-lines single
