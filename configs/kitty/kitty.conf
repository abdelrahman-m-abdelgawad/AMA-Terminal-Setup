# AMA Robotics Lab — clean Kitty configuration
shell /usr/bin/zsh --login --interactive
shell_integration no-title
font_family JetBrainsMono Nerd Font Mono
font_size 12.5

foreground #DCE7F5
background #050F20
background_image ${HOME}/.config/ama/assets/10_background_blueprint.png
background_image_layout cscaled
background_image_linear yes
background_tint 0.06
background_opacity 1.0
wayland_titlebar_color #0B1B2E
selection_foreground #07111F
selection_background #7DD3FC
cursor #38BDF8
cursor_text_color #07111F
url_color #67E8F9
url_style curly

window_padding_width 12
scrollback_lines 20000
remember_window_size yes
initial_window_width 120c
initial_window_height 36c
confirm_os_window_close 0
hide_window_decorations no

cursor_shape beam
cursor_blink_interval 0.5
mouse_hide_wait 3.0
enable_audio_bell no
visual_bell_duration 0.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled
active_tab_background #1D4ED8
active_tab_foreground #F8FAFC
inactive_tab_background #0B1B2E
inactive_tab_foreground #8EA5BE
tab_title_template " {index}: {title} "
active_tab_title_template " ◈ {index}: {title} "
tab_activity_symbol "●"

color0  #07111F
color1  #F87171
color2  #34D399
color3  #FBBF24
color4  #3B82F6
color5  #A78BFA
color6  #22D3EE
color7  #DCE7F5
color8  #334155
color9  #FB7185
color10 #6EE7B7
color11 #FCD34D
color12 #60A5FA
color13 #C4B5FD
color14 #67E8F9
color15 #F8FAFC

map ctrl+c copy_or_interrupt
map ctrl+shift+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+a launch --type=clipboard --stdin-source=@screen_scrollback
map ctrl+shift+o copy_last_command_output
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+alt+enter launch --cwd=current --location=hsplit
map ctrl+alt+shift+enter launch --cwd=current --location=vsplit
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f5 load_config_file
map ctrl+shift+f2 edit_config_file
window_title_template "🐈  {title}"
